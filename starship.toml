"$schema" = 'https://starship.rs/config-schema.json'

# .zshrc の %n@%m %~ %# と右側の %T を踏襲する。
format = '$username$hostname$directory$git_branch$git_status$nodejs$python$rust$golang$ruby${env_var.prompt_character}'
right_format = '$time'
add_newline = false

[username]
show_always = true
style_user = 'green'
style_root = 'green'
format = '[$user]($style)'

[hostname]
ssh_only = false
trim_at = '.'
style = 'green'
format = '[@$hostname]($style) '

[directory]
truncation_length = 0
truncate_to_repo = false
use_logical_path = true
style = 'yellow'
format = '[$path]($style) '

[git_branch]
symbol = 'git:'

[nodejs]
symbol = 'node '

[python]
symbol = 'py '

[rust]
symbol = 'rs '

[golang]
symbol = 'go '

[ruby]
symbol = 'rb '

# zsh 側で一般ユーザーは %、特権ユーザーは # を設定する。
[env_var.prompt_character]
variable = 'STARSHIP_PROMPT_CHARACTER'
default = '%'
format = '[$env_value](red) '

[time]
disabled = false
time_format = '%H:%M'
format = '$time'
